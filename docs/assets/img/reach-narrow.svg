<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 702" width="360" height="702" role="img" aria-labelledby="t d">
<title id="t">Who can reach your Ollama, and what they can do</title>
<desc id="d">Three nested zones: this computer only (the default), your network (if OLLAMA_HOST is 0.0.0.0), and the internet (if the port is forwarded). Anyone who can connect can chat with, download, delete and create models, and, if the app is signed in to ollama.com, see the account and use its cloud models and web search.</desc>
<style>
  .bg{fill:#fcfcfb} .card{fill:#f0efea} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .mut{fill:#77756f}
  .acc{fill:#2a78d6} .accw{fill:#e8f1fc} .soft{fill:#86b6ef} .none{fill:#d6d4cc}
  .warn{fill:#a35200} .warnw{fill:#fdf1e3} .white{fill:#ffffff}
  .ln{stroke:#77756f;fill:none} .accl{stroke:#2a78d6;fill:none} .warnl{stroke:#a35200;fill:none} .rule{stroke:#e1e0d9}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .card{fill:#232321} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .mut{fill:#9a988f}
    .acc{fill:#3987e5} .accw{fill:#142338} .soft{fill:#184f95} .none{fill:#3a3936}
    .warn{fill:#ec9a5a} .warnw{fill:#2d1d0f}
    .ln{stroke:#9a988f} .accl{stroke:#6da7ec} .warnl{stroke:#ec9a5a} .rule{stroke:#2c2c2a}
  }
</style>
<rect class="bg" width="360" height="702" rx="14"/>
<text x="16" y="32" class="ink" font-size="18" font-weight="700" text-anchor="start" >Who can reach your Ollama,</text>
<text x="16" y="54" class="ink" font-size="18" font-weight="700" text-anchor="start" >and what they can do</text>
<rect x="16" y="72" width="328" height="230" rx="12" class="accw" stroke-width="1.5" style="stroke:#77756f;stroke-opacity:.35"/>
<text x="30" y="96" class="ink" font-size="15" font-weight="700" text-anchor="start" >The internet</text>
<text x="30" y="115" class="ink2" font-size="13" font-weight="400" text-anchor="start" >if your router forwards port 11434</text>
<rect x="30" y="136" width="300" height="154" rx="12" class="card" stroke-width="1.5" style="stroke:#77756f;stroke-opacity:.35"/>
<text x="44" y="160" class="ink" font-size="15" font-weight="700" text-anchor="start" >Your Wi-Fi or office network</text>
<text x="44" y="179" class="ink2" font-size="13" font-weight="400" text-anchor="start" >OLLAMA_HOST=0.0.0.0, or</text>
<text x="44" y="196" class="ink2" font-size="13" font-weight="400" text-anchor="start" >LM Studio&#x27;s network switch</text>
<rect x="44" y="220" width="272" height="58" rx="12" class="bg" stroke-width="1.5" style="stroke:#77756f;stroke-opacity:.35"/>
<text x="58" y="244" class="ink" font-size="15" font-weight="700" text-anchor="start" >This computer only</text>
<text x="58" y="263" class="ink2" font-size="13" font-weight="400" text-anchor="start" >the default: 127.0.0.1</text>
<text x="16" y="336" class="ink" font-size="15" font-weight="700" text-anchor="start" >Anyone who can connect can,</text>
<text x="16" y="356" class="ink" font-size="15" font-weight="700" text-anchor="start" >with no login:</text>
<circle cx="24" cy="381" r="3" class="acc"/><text x="36" y="386" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >Chat with your models</text>
<text x="36" y="408" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >and see which ones you have</text>
<circle cx="24" cy="429" r="3" class="acc"/><text x="36" y="434" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >Download, copy or delete models</text>
<circle cx="24" cy="455" r="3" class="acc"/><text x="36" y="460" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >Create a model with its own</text>
<text x="36" y="482" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >instructions</text>
<text x="16" y="516" class="warn" font-size="14.5" font-weight="700" text-anchor="start" >If you&#x27;re signed in to ollama.com:</text>
<circle cx="24" cy="537" r="3" class="warn"/><text x="36" y="542" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >see your account&#x27;s name, email</text>
<text x="36" y="564" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >and plan</text>
<circle cx="24" cy="585" r="3" class="warn"/><text x="36" y="590" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >see its usage and balance</text>
<circle cx="24" cy="611" r="3" class="warn"/><text x="36" y="616" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >run cloud models and web</text>
<text x="36" y="638" class="ink" font-size="14.5" font-weight="400" text-anchor="start" >searches on it</text>
<text x="16" y="668" class="mut" font-size="12" font-weight="400" text-anchor="start" >Source: Ollama v0.40.7, server/routes.go</text>
<text x="16" y="685" class="mut" font-size="12" font-weight="400" text-anchor="start" >and server/cloud_proxy.go (read by the author).</text>
</svg>
