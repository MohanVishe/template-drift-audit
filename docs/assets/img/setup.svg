<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 330" width="856" height="330" role="img" aria-labelledby="t d">
<title id="t">A local AI setup and its six weak spots</title>
<desc id="d">You type a message; the app lays it out with the chat template; the model reads the result. The model file, helpers and saved chats sit alongside. Numbers mark the six weak spots.</desc>
<style>
  .bg{fill:#fcfcfb} .card{fill:#f0efea} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .mut{fill:#77756f}
  .acc{fill:#2a78d6} .accw{fill:#e8f1fc} .soft{fill:#86b6ef} .none{fill:#d6d4cc}
  .warn{fill:#a35200} .warnw{fill:#fdf1e3} .white{fill:#ffffff}
  .ln{stroke:#77756f;fill:none} .accl{stroke:#2a78d6;fill:none} .warnl{stroke:#a35200;fill:none} .rule{stroke:#e1e0d9}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .card{fill:#232321} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .mut{fill:#9a988f}
    .acc{fill:#3987e5} .accw{fill:#142338} .soft{fill:#184f95} .none{fill:#3a3936}
    .warn{fill:#ec9a5a} .warnw{fill:#2d1d0f}
    .ln{stroke:#9a988f} .accl{stroke:#6da7ec} .warnl{stroke:#ec9a5a} .rule{stroke:#2c2c2a}
  }
</style>
<rect class="bg" width="856" height="330" rx="14"/>
<text x="28" y="40" class="ink" font-size="20" font-weight="700" text-anchor="start" >A local AI setup, and its six weak spots</text>
<rect x="28" y="70" width="170" height="78" rx="10" class="card"/>
<text x="44" y="104" class="ink" font-size="16" font-weight="700" text-anchor="start" >You</text>
<text x="44" y="128" class="ink2" font-size="13" font-weight="400" text-anchor="start" >type a message</text>
<line x1="202" y1="109" x2="228" y2="109" class="ln" stroke-width="2"/><path d="M226,104 L234,109 L226,114 Z" class="mut"/>
<rect x="238" y="70" width="170" height="78" rx="10" class="card"/>
<text x="254" y="104" class="ink" font-size="16" font-weight="700" text-anchor="start" >The app</text>
<text x="254" y="128" class="ink2" font-size="13" font-weight="400" text-anchor="start" >Ollama or LM Studio</text>
<circle cx="362" cy="72" r="12" class="acc"/><text x="362" y="77" class="white" font-size="13" font-weight="700" text-anchor="middle" >1</text>
<circle cx="390" cy="72" r="12" class="acc"/><text x="390" y="77" class="white" font-size="13" font-weight="700" text-anchor="middle" >2</text>
<line x1="412" y1="109" x2="438" y2="109" class="ln" stroke-width="2"/><path d="M436,104 L444,109 L436,114 Z" class="mut"/>
<rect x="448" y="70" width="170" height="78" rx="10" class="card"/>
<text x="464" y="104" class="ink" font-size="16" font-weight="700" text-anchor="start" >The layout step</text>
<text x="464" y="128" class="ink2" font-size="13" font-weight="400" text-anchor="start" >chat template</text>
<circle cx="600" cy="72" r="12" class="acc"/><text x="600" y="77" class="white" font-size="13" font-weight="700" text-anchor="middle" >4</text>
<line x1="622" y1="109" x2="648" y2="109" class="ln" stroke-width="2"/><path d="M646,104 L654,109 L646,114 Z" class="mut"/>
<rect x="658" y="70" width="170" height="78" rx="10" class="card"/>
<text x="674" y="104" class="ink" font-size="16" font-weight="700" text-anchor="start" >The model</text>
<text x="674" y="128" class="ink2" font-size="13" font-weight="400" text-anchor="start" >reads one block of text</text>
<rect x="28" y="178" width="260" height="70" rx="10" class="card"/>
<text x="44" y="208" class="ink" font-size="16" font-weight="700" text-anchor="start" >The model file</text>
<text x="44" y="231" class="ink2" font-size="13" font-weight="400" text-anchor="start" >model, settings, template</text>
<circle cx="270" cy="180" r="12" class="acc"/><text x="270" y="185" class="white" font-size="13" font-weight="700" text-anchor="middle" >3</text>
<rect x="300" y="178" width="260" height="70" rx="10" class="card"/>
<text x="316" y="208" class="ink" font-size="16" font-weight="700" text-anchor="start" >Helpers</text>
<text x="316" y="231" class="ink2" font-size="13" font-weight="400" text-anchor="start" >read files, run commands</text>
<circle cx="542" cy="180" r="12" class="acc"/><text x="542" y="185" class="white" font-size="13" font-weight="700" text-anchor="middle" >5</text>
<rect x="572" y="178" width="260" height="70" rx="10" class="card"/>
<text x="588" y="208" class="ink" font-size="16" font-weight="700" text-anchor="start" >Saved chats</text>
<text x="588" y="231" class="ink2" font-size="13" font-weight="400" text-anchor="start" >files on your disk</text>
<circle cx="814" cy="180" r="12" class="acc"/><text x="814" y="185" class="white" font-size="13" font-weight="700" text-anchor="middle" >6</text>
<circle cx="38" cy="279" r="9" class="acc"/><text x="38" y="284" class="white" font-size="11" font-weight="700" text-anchor="middle" >1</text>
<text x="54" y="284" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >the app answers anyone who can reach it</text>
<circle cx="310" cy="279" r="9" class="acc"/><text x="310" y="284" class="white" font-size="11" font-weight="700" text-anchor="middle" >2</text>
<text x="326" y="284" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >older versions have known holes</text>
<circle cx="582" cy="279" r="9" class="acc"/><text x="582" y="284" class="white" font-size="11" font-weight="700" text-anchor="middle" >3</text>
<text x="598" y="284" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >the model file carries more than the model</text>
<circle cx="38" cy="305" r="9" class="acc"/><text x="38" y="310" class="white" font-size="11" font-weight="700" text-anchor="middle" >4</text>
<text x="54" y="310" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >the layout can change what it reads</text>
<circle cx="310" cy="305" r="9" class="acc"/><text x="310" y="310" class="white" font-size="11" font-weight="700" text-anchor="middle" >5</text>
<text x="326" y="310" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >helpers turn words into actions</text>
<circle cx="582" cy="305" r="9" class="acc"/><text x="582" y="310" class="white" font-size="11" font-weight="700" text-anchor="middle" >6</text>
<text x="598" y="310" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >chats are kept as ordinary files</text>
</svg>
