<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 476" width="856" height="476" role="img" aria-labelledby="t d">
<title id="t">Ollama&#x27;s security fixes, and how each hole is reached</title>
<desc id="d">7 May 2024, version 0.1.34: Probllama: take over the computer through a crafted model download (CVE-2024-37032); 22 Jun 2024, version 0.1.46: Crash the app, or learn which files exist on the computer (CVE-2024-39720, 39722); 27 Jun 2024, version 0.1.47: Write files outside the models folder through a ZIP upload (CVE-2024-45436); 24 Feb 2026, version 0.17.1: Bleeding Llama: read the app&#x27;s memory, keys and chats included (CVE-2026-7482); 12 May 2026, version 0.23.3: Windows only: the updater accepted unchecked updates (CVE-2026-42248, 42249). 4 of 5 are reached through Ollama&#x27;s API. The newest version is 0.40.8, 21 October 2026.</desc>
<style>
  .bg{fill:#fcfcfb} .card{fill:#f0efea} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .mut{fill:#77756f}
  .acc{fill:#2a78d6} .accw{fill:#e8f1fc} .soft{fill:#86b6ef} .none{fill:#d6d4cc}
  .warn{fill:#a35200} .warnw{fill:#fdf1e3} .white{fill:#ffffff}
  .ln{stroke:#77756f;fill:none} .accl{stroke:#2a78d6;fill:none} .warnl{stroke:#a35200;fill:none} .rule{stroke:#e1e0d9}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .card{fill:#232321} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .mut{fill:#9a988f}
    .acc{fill:#3987e5} .accw{fill:#142338} .soft{fill:#184f95} .none{fill:#3a3936}
    .warn{fill:#ec9a5a} .warnw{fill:#2d1d0f}
    .ln{stroke:#9a988f} .accl{stroke:#6da7ec} .warnl{stroke:#ec9a5a} .rule{stroke:#2c2c2a}
  }
</style>
<rect class="bg" width="856" height="476" rx="14"/>
<text x="28" y="40" class="ink" font-size="20" font-weight="700" text-anchor="start" >Ollama&#x27;s security fixes, and how each hole is reached</text>
<text x="28" y="62" class="ink2" font-size="13" font-weight="400" text-anchor="start" >4 of these 5 are reached by sending requests to Ollama&#x27;s API: the open door from weak spot 1.</text>
<line x1="150" y1="88" x2="150" y2="416" class="ln" stroke-width="2"/>
<text x="28" y="114" class="ink2" font-size="13" font-weight="400" text-anchor="start" >7 May 2024</text>
<circle cx="150" cy="109" r="7" class="warn"/>
<rect x="170" y="88" width="62" height="30" rx="10" class="card"/>
<text x="201" y="108" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.1.34</text>
<text x="246" y="102" class="ink" font-size="14" font-weight="400" text-anchor="start" >Probllama: take over the computer through a</text>
<text x="246" y="122" class="ink2" font-size="13" font-weight="400" text-anchor="start" >crafted model download (CVE-2024-37032)</text>
<rect x="690" y="90" width="138" height="28" rx="10" class="warnw"/>
<text x="759" y="109" class="warn" font-size="12.5" font-weight="700" text-anchor="middle" >through the API</text>
<text x="28" y="174" class="ink2" font-size="13" font-weight="400" text-anchor="start" >22 Jun 2024</text>
<circle cx="150" cy="169" r="7" class="warn"/>
<rect x="170" y="148" width="62" height="30" rx="10" class="card"/>
<text x="201" y="168" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.1.46</text>
<text x="246" y="162" class="ink" font-size="14" font-weight="400" text-anchor="start" >Crash the app, or learn which files exist on the</text>
<text x="246" y="182" class="ink2" font-size="13" font-weight="400" text-anchor="start" >computer (CVE-2024-39720, 39722)</text>
<rect x="690" y="150" width="138" height="28" rx="10" class="warnw"/>
<text x="759" y="169" class="warn" font-size="12.5" font-weight="700" text-anchor="middle" >through the API</text>
<text x="28" y="234" class="ink2" font-size="13" font-weight="400" text-anchor="start" >27 Jun 2024</text>
<circle cx="150" cy="229" r="7" class="warn"/>
<rect x="170" y="208" width="62" height="30" rx="10" class="card"/>
<text x="201" y="228" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.1.47</text>
<text x="246" y="222" class="ink" font-size="14" font-weight="400" text-anchor="start" >Write files outside the models folder through a</text>
<text x="246" y="242" class="ink2" font-size="13" font-weight="400" text-anchor="start" >ZIP upload (CVE-2024-45436)</text>
<rect x="690" y="210" width="138" height="28" rx="10" class="warnw"/>
<text x="759" y="229" class="warn" font-size="12.5" font-weight="700" text-anchor="middle" >through the API</text>
<text x="28" y="294" class="ink2" font-size="13" font-weight="400" text-anchor="start" >24 Feb 2026</text>
<circle cx="150" cy="289" r="7" class="warn"/>
<rect x="170" y="268" width="62" height="30" rx="10" class="card"/>
<text x="201" y="288" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.17.1</text>
<text x="246" y="282" class="ink" font-size="14" font-weight="400" text-anchor="start" >Bleeding Llama: read the app&#x27;s memory, keys and</text>
<text x="246" y="302" class="ink2" font-size="13" font-weight="400" text-anchor="start" >chats included (CVE-2026-7482)</text>
<rect x="690" y="270" width="138" height="28" rx="10" class="warnw"/>
<text x="759" y="289" class="warn" font-size="12.5" font-weight="700" text-anchor="middle" >through the API</text>
<text x="28" y="354" class="ink2" font-size="13" font-weight="400" text-anchor="start" >12 May 2026</text>
<circle cx="150" cy="349" r="7" class="mut"/>
<rect x="170" y="328" width="62" height="30" rx="10" class="card"/>
<text x="201" y="348" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.23.3</text>
<text x="246" y="342" class="ink" font-size="14" font-weight="400" text-anchor="start" >Windows only: the updater accepted unchecked</text>
<text x="246" y="362" class="ink2" font-size="13" font-weight="400" text-anchor="start" >updates (CVE-2026-42248, 42249)</text>
<rect x="690" y="330" width="138" height="28" rx="10" class="card"/>
<text x="759" y="349" class="ink2" font-size="12.5" font-weight="700" text-anchor="middle" >through the updater</text>
<circle cx="150" cy="409" r="7" class="acc"/>
<text x="28" y="414" class="ink2" font-size="13" font-weight="400" text-anchor="start" >21 Oct 2026</text>
<rect x="170" y="388" width="62" height="30" rx="10" class="accw"/>
<text x="201" y="408" class="ink mono" font-size="13" font-weight="700" text-anchor="middle" >0.40.8</text>
<text x="246" y="414" class="ink" font-size="14" font-weight="700" text-anchor="start" >The newest version when this was written. Update to it or later.</text>
<text x="28" y="458" class="mut" font-size="12" font-weight="400" text-anchor="start" >Dates are the release of the fixed version. Sources: GitHub Advisory Database, NVD, Ollama release notes, Wiz, Oligo, Cyera.</text>
