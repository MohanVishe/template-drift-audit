<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" width="360" height="364" role="img" aria-labelledby="t d">
<title id="t">The maker&#x27;s layout wins whichever parser reads the reply</title>
<desc id="d">Read by the benchmark&#x27;s parser (BFCL): Ollama&#x27;s layout 1034 of 1240, maker&#x27;s layout 1079 of 1240; Read by Ollama&#x27;s own parser, as in everyday use: Ollama&#x27;s layout 1053 of 1240, maker&#x27;s layout 1093 of 1240</desc>
<style>
  .bg{fill:#fcfcfb} .card{fill:#f0efea} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .mut{fill:#77756f}
  .acc{fill:#2a78d6} .accw{fill:#e8f1fc} .soft{fill:#86b6ef} .none{fill:#d6d4cc}
  .warn{fill:#a35200} .warnw{fill:#fdf1e3} .white{fill:#ffffff}
  .ln{stroke:#77756f;fill:none} .accl{stroke:#2a78d6;fill:none} .warnl{stroke:#a35200;fill:none} .rule{stroke:#e1e0d9}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .card{fill:#232321} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .mut{fill:#9a988f}
    .acc{fill:#3987e5} .accw{fill:#142338} .soft{fill:#184f95} .none{fill:#3a3936}
    .warn{fill:#ec9a5a} .warnw{fill:#2d1d0f}
    .ln{stroke:#9a988f} .accl{stroke:#6da7ec} .warnl{stroke:#ec9a5a} .rule{stroke:#2c2c2a}
  }
</style>
<rect class="bg" width="360" height="364" rx="14"/>
<text x="16" y="32" class="ink" font-size="18" font-weight="700" text-anchor="start" >The maker&#x27;s layout wins</text>
<text x="16" y="54" class="ink" font-size="18" font-weight="700" text-anchor="start" >whichever parser reads it</text>
<text x="16" y="76" class="ink2" font-size="13" font-weight="400" text-anchor="start" >Share of 1,240 questions answered correctly.</text>
<rect x="16" y="90" width="12" height="12" rx="3" class="acc"/><text x="34" y="101" class="ink" font-size="13" font-weight="400" text-anchor="start" >Ollama&#x27;s layout</text>
<rect x="170" y="90" width="12" height="12" rx="3" class="warn"/><text x="188" y="101" class="ink" font-size="13" font-weight="400" text-anchor="start" >The maker&#x27;s layout</text>
<text x="16" y="136" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Benchmark&#x27;s parser (BFCL)</text>
<text x="344" y="136" class="ink2" font-size="13" font-weight="400" text-anchor="end" >+45, clear</text>
<rect x="16" y="146" width="168" height="13" rx="4" class="none"/>
<rect x="16" y="146" width="140.1" height="13" rx="4" class="acc"/>
<text x="194" y="157" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >83.4% (1,034)</text>
<rect x="16" y="166" width="168" height="13" rx="4" class="none"/>
<rect x="16" y="166" width="146.2" height="13" rx="4" class="warn"/>
<text x="194" y="177" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >87.0% (1,079)</text>
<text x="16" y="208" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Ollama&#x27;s own parser</text>
<text x="344" y="208" class="ink2" font-size="13" font-weight="400" text-anchor="end" >+40, clear</text>
<rect x="16" y="218" width="168" height="13" rx="4" class="none"/>
<rect x="16" y="218" width="142.7" height="13" rx="4" class="acc"/>
<text x="194" y="229" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >84.9% (1,053)</text>
<rect x="16" y="238" width="168" height="13" rx="4" class="none"/>
<rect x="16" y="238" width="148.1" height="13" rx="4" class="warn"/>
<text x="194" y="249" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >88.1% (1,093)</text>
<text x="16" y="274" class="mut" font-size="12" font-weight="400" text-anchor="start" >Right of each name: extra correct answers</text>
<text x="16" y="291" class="mut" font-size="12" font-weight="400" text-anchor="start" >with the maker&#x27;s layout. &quot;Clear&quot;: exact</text>
<text x="16" y="308" class="mut" font-size="12" font-weight="400" text-anchor="start" >paired test, p below 0.001.</text>
<text x="16" y="330" class="mut" font-size="12" font-weight="400" text-anchor="start" >Source: runs/h3-mini/qwen2.5/</text>
<text x="16" y="347" class="mut" font-size="12" font-weight="400" text-anchor="start" >report*.json; questions from BFCL.</text>
</svg>
