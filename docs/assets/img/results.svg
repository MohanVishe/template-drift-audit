<rect x="470" y="244" width="18.1" height="14" rx="4" class="acc"/>
<text x="770" y="257" class="ink" font-size="14" font-weight="700" text-anchor="start" >2 of 32</text>
<text x="28" y="318" class="mut" font-size="12" font-weight="400" text-anchor="start" >Source: runs/p2-headline.json in the project repository.</text>
